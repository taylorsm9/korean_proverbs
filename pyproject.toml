[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "korean-proverb"
version = "0.1.0"
description = "Korean proverbs (속담) → English dataset derived from Urimalsaem."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "openai>=1.40",
  "httpx>=0.27",
  "tqdm>=4.66",
]

[project.optional-dependencies]
research = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "sacrebleu>=2.4",
  "sentence-transformers>=3.0",
  "umap-learn>=0.5",
  "matplotlib>=3.8",
  "scikit-learn>=1.3",
  "rank-bm25>=0.2.2",
]
embed-server = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.28",
]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
